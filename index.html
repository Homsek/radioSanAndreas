<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="css/style.css">
   <title>San Andreas Radio</title>
</head>

<body>
   <div class="wrapper">
      <main class="main">
         <h1 class="title">San Andreas Radio</h1>
         <div class="radio">
            <nav class="radio__icons">
               <img class="radio__icon" data-radio="BounceFM" data-audio="audio/BounceFM.mp3"
                  src="img/radioLogo/BounceFM.webp" alt="BounceFM">
               <img class="radio__icon" data-radio="CSR1039" data-audio="audio/CSR-103.mp3"
                  src="img/radioLogo/CSR1039.webp" alt="CSR1039">
               <img class="radio__icon" data-radio="K-DST" src="img/radioLogo/K-DST.webp" alt="K-DST">
               <img class="radio__icon" data-radio="KJAHWest" src="img/radioLogo/KJAHWest.webp" alt="KJAHWest">
               <img class="radio__icon" data-radio="MasterSounds983" src="img/radioLogo/MasterSounds983.webp"
                  alt="MasterSounds983">
               <img class="radio__icon" data-radio="PlaybackFM" data-audio="audio/PlaybackFM.mp3"
                  src="img/radioLogo/PlaybackFM.svg" alt="PlaybackFM">
               <img class="radio__icon" data-radio="RadioLosSantos" data-audio="audio/RadioLosSantos.mp3"
                  src="img/radioLogo/RadioLosSantos.webp" alt="RadioLosSantos">
               <img class="radio__icon" data-radio="RadioX" src="img/radioLogo/RadioX.webp" alt="RadioX">
               <img class="radio__icon" data-radio="SFUR" data-audio="audio/SFUR.mp3" src="img/radioLogo/SFUR.webp"
                  alt="SFUR">
            </nav>
         </div>
      </main>
   </div>
</body>
<script src="js/script.js"></script>

</html>
